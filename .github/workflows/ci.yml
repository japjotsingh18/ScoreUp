name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.14.0

jobs:
  quality:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check strict TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run unit and component tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  database:
    name: Database lint and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Rebuild migrations from zero
        run: npm run db:reset

      - name: Lint database schemas
        run: npm run db:lint

      - name: Run pgTAP authorization and rules suite
        run: npm run test:db

  e2e:
    name: Two-client Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Rebuild migrations from zero
        run: npm run db:reset

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run isolated multiplayer browser scenarios
        run: npm run test:e2e

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
